<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/leon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMMBER</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect: restore the original path that 404.html
      // encoded into the query string, so BrowserRouter picks it up.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
